<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NFD Business – منصة النفاض</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a0a0a"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"><style id="css">:root{--bg:#0a0a0a;--surface:#1e1e1e;--ink:#f4ecd6;--muted:#a39a82;--line:#2c2718;--brand:#d4af37;--brand-ink:#14100a;--tape:#f3e5ab;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
header{background:#000;color:var(--ink);text-align:center;padding:14px 16px 12px;border-bottom:2px solid var(--brand)}
header img{height:120px;max-width:70%;object-fit:contain}
header p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.cats{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.cats button{flex:none;font:inherit;font-size:.85rem;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.cats button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{padding:12px 14px 110px;max-width:900px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1;font-weight:600}
.row .p{color:var(--muted);white-space:nowrap}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.1rem;cursor:pointer}
.qty b{min-width:26px;text-align:center}
.add{font:inherit;padding:6px 14px;border-radius:8px;border:0;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.empty{color:var(--muted);padding:24px 0;text-align:center}
#fab{position:fixed;inset-inline:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:none;justify-content:space-between;align-items:center;padding:14px 18px;border:0;border-radius:12px;background:var(--tape);color:#14100a;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:none}
#sheet .in{position:absolute;inset-inline:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#sheet h2{margin:0 0 8px;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;color:var(--ink);font-size:1.5rem;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;padding:12px 0}
.send{width:100%;font:inherit;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);cursor:pointer;margin-top:8px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.err{color:#c0392b;font-size:.85rem;margin-top:6px;min-height:1.2em}
.cat{margin:18px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--brand);color:var(--brand);font-size:1.05rem}
.n small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.out{color:#e0604f;font-weight:700}
.qty button:disabled{opacity:.35}
input[type=checkbox],input[type=radio]{width:auto}
#admbtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline-start:8px;z-index:7;font:inherit;font-size:.8rem;padding:5px 10px;border-radius:8px;border:1px solid var(--brand);background:#000;color:var(--brand);cursor:pointer}
#adm{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}.tabs button.on{background:var(--brand);color:var(--brand-ink)}
.arow{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.arow .a-n,.arow .a-q,.arow .a-s{grid-column:1/-1}.hid{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink)}
.a-d{font:inherit;border:1px solid #e0604f;color:#e0604f;background:none;border-radius:8px;padding:6px;cursor:pointer}
.sv{font:inherit;font-weight:700;padding:8px 14px;border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);cursor:pointer}.sv:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note{color:var(--muted);font-size:.85rem;margin:6px 0}
header{background:linear-gradient(180deg,#000,#16120a)!important;box-shadow:0 2px 24px rgba(201,162,74,.18)}
.cnt{margin-inline-start:10px;font-size:.75rem;color:var(--muted);font-weight:400}
html{overflow-x:hidden}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ph{aspect-ratio:1/1;background:#000;display:flex;align-items:center;justify-content:center;cursor:zoom-in;color:var(--brand);font-weight:700;letter-spacing:3px;border-bottom:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ci{padding:10px 12px 2px;flex:1}.cn{font-weight:600;font-size:.95rem;line-height:1.35}
.cp{color:var(--brand);font-weight:700;margin-top:3px;font-size:1.05rem}.cp small,.un{color:var(--muted);font-weight:400;font-size:.72rem}
.cc{font-size:.78rem;color:var(--tape);margin-top:3px}.cq{font-size:.75rem;color:var(--muted);margin-top:2px}
.ca{padding:8px 12px 12px;display:flex;justify-content:center}.ca .add{width:100%;padding:9px}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:#000}.up{display:inline-block;margin:0;padding:7px 10px;border:1px solid var(--brand);border-radius:8px;color:var(--brand);cursor:pointer;text-align:center}
.card{position:relative}
.ca{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}.ca>*{min-width:0}.ca>:only-child{grid-column:1/-1}
.ca .add{padding:9px 4px;font-size:.85rem}.ca .qty{justify-content:space-between}.ca .qty button{width:28px;height:30px}
.ca2{display:grid;grid-template-columns:1fr;gap:6px;min-width:150px}.ca2 .add{width:100%}
#sheet .in{max-width:560px;margin-inline:auto}
.nw{position:absolute;top:8px;inset-inline-start:8px;z-index:2;background:linear-gradient(135deg,#f3e5ab,#d4af37);color:#14100a;font-style:normal;font-weight:700;font-size:.72rem;padding:2px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sk{font-size:.72rem;color:var(--muted);letter-spacing:.5px;direction:ltr;text-align:right}
.lnk{font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
#brands button{font-size:1rem;font-weight:700;padding:8px 20px;border-color:var(--brand)}
body:has(#sheet[style*="block"]){overflow:hidden}#sheet .in{overscroll-behavior:contain}

.cn{overflow-wrap:anywhere}
.qty .un{min-width:44px;font-size:.78rem}
.qin{flex:1 1 0;min-width:0;width:100%;text-align:center;padding:6px 2px;font-weight:700;border-radius:8px;-moz-appearance:textfield}
.qin::-webkit-inner-spin-button,.qin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.shim{height:12px;border-radius:6px;margin:6px 0;background:linear-gradient(90deg,#1e1e1e,#2d2d2d,#1e1e1e);background-size:200% 100%;animation:shm 1.2s linear infinite}.shim.s{width:60%}.shimh{background:linear-gradient(90deg,#141414,#242424,#141414);background-size:200% 100%;animation:shm 1.2s linear infinite}
@keyframes shm{to{background-position:-200% 0}}
#ann{background:linear-gradient(90deg,#8a6a1f,#f3e5ab,#8a6a1f);color:#14100a;text-align:center;font-weight:700;font-size:.85rem;padding:6px 10px}
#hinfo{margin-top:6px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:.9rem}#hinfo a{color:var(--brand);text-decoration:none}
#instbtn{font:inherit;font-size:.8rem;padding:4px 12px;border-radius:999px;border:1px solid var(--brand);background:none;color:var(--brand);cursor:pointer}#instbtn[hidden],#foot #instlink[hidden]{display:none}
.wafab{position:fixed;inset-inline-end:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:6;width:54px;height:54px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#foot{background:#000;border-top:2px solid var(--brand);padding:18px 16px 28px;margin-top:20px;color:var(--muted);font-size:.9rem}
#foot .fc{max-width:900px;margin:0 auto;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#foot h4{color:var(--brand);margin:0 0 6px}#foot a{color:var(--ink);text-decoration:none}
#foot .fl{display:block;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;padding:3px 0;text-align:start}#foot .cpy{grid-column:1/-1;text-align:center;font-size:.8rem}
#wel,#instpop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px}
.wc{position:relative;background:var(--surface);border:1px solid var(--brand);border-radius:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;padding:20px 18px;text-align:center}
.wc .wl{height:90px;max-width:60%;object-fit:contain}.wc h3{margin:8px 0 12px;color:var(--brand)}.wc p{color:var(--muted);margin:0 0 12px}
.wx,.ipx{position:absolute;top:8px;inset-inline-start:10px;background:none;border:0;color:var(--ink);font-size:1.6rem;cursor:pointer}
.wp{display:grid;gap:8px;margin-bottom:14px}.wpt{background:#141414;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:start}.wpt b{display:block;color:var(--tape)}.wpt span{color:var(--muted);font-size:.85rem}
.wgo{width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
